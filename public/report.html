<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roast Room report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/report.css" />
  </head>
  <body>
    <div class="toolbar">
      <button type="button" id="save-pdf">Save as PDF</button>
      <span>In the print dialog, choose <b>Save as PDF</b> as the destination.</span>
    </div>
    <main class="page" id="report">
      <p class="empty">No roast to report yet. Run a roast in the Roast Room, then click <b>Download PDF report</b>.</p>
    </main>
    <script type="module" src="/report.js"></script>
  </body>
</html>
